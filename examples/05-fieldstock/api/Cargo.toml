[package]
name = "fieldstock-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "=0.5.3", features = ["limit", "load-shed", "util"] }
tower-http = { version = "=0.7.1", features = ["cors", "timeout", "set-header"] }
utoipa = "=6.0.0"
